# Pre-commit configuration for DevOps MCP Server
# See: https://pre-commit.com for more information

# CI configuration
ci:
  autofix_commit_msg_style: false
  autoupdate_commit: true
  autoupdate_schedule: weekly
  skip: []
  submodules: false

# Repositories to update
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
        entry: trailing-whitespace-fixer
        language: system
        types: [python, yaml, markdown]

      - id: end-of-file-fixer
        name: Fix End of Files
        entry: end-of-file-fixer
        language: system
        types: [python, yaml, markdown]

      - id: check-yaml
        name: Check YAML
        entry: check-yaml
        language: system
        types: [yaml]

      - id: check-toml
        name: Check TOML
        entry: check-toml
        language: system
        types: [toml]

      - id: check-json
        name: Check JSON
        entry: check-json
        language: system
        types: [json]

      - id: check-added-large-files
        name: Check for added large files
        entry: check-added-large-files
        args: ['--maxkb=100', '--enforce-all']
        language: system

      - id: check-merge-conflict
        name: Check for merge conflicts
        entry: check-merge-conflict
        language: system

      - id: check-case-conflict
        name: Check for case conflicts
        entry: check-case-conflict
        language: system

      - id: check-symlinks
        name: Check for symlinks
        entry: check-symlinks
        language: system

      - id: detect-private-key
        name: Detect Private Keys
        entry: detect-private-key
        language: system
        types: [python]

  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        name: Black (Python formatter)
        entry: black
        language_version: python3.12
        types: [python]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.7
    hooks:
      - id: ruff
        name: Ruff (Python linter)
        entry: ruff check --fix
        language_version: python3.12
        types: [python]

      - id: ruff-format
        name: Ruff (Python formatter)
        entry: ruff format
        language_version: python3.12
        types: [python]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.0.0
    hooks:
      - id: mypy
        name: mypy (Python type checker)
        entry: mypy
        language_version: python3.12
        types: [python]
        args: [--ignore-missing-imports]
        additional_dependencies: [mypy, types-typing]

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.367
    hooks:
      - id: pyright
        name: Pyright (Python type checker)
        entry: pyright
        language_version: python3.12
        types: [python]

# Local hooks
  - repo: local
    hooks:
      - id: check-docstring-first
        name: Check docstring is first
        entry: python scripts/check_docstring_first.py
        language: system
        types: [python]

      - id: check-ast
        name: Check Python AST
        entry: python scripts/check_ast.py
        language: system
        types: [python]
